<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Generador de Pases | XV Brenda</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'azul-real': '#1B263B',
                        'oro-viejo': '#C5A059',
                        'gris-pizarra': '#415A77',
                        'pergamino': '#F4EAD4',
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-azul-real text-pergamino font-sans min-h-screen flex items-center justify-center p-4">

    <div
        class="max-w-xl w-full bg-gris-pizarra/30 border-2 border-oro-viejo p-6 md:p-8 rounded-lg shadow-2xl backdrop-blur-md">

        <!-- Header -->
        <div class="text-center mb-8 border-b border-oro-viejo/30 pb-4">
            <h1 class="font-serif text-3xl font-bold text-oro-viejo uppercase tracking-wider">Generador de Pases</h1>
            <p class="text-xs text-pergamino/70 tracking-widest mt-1">XV Años Brenda</p>
        </div>

        <!-- Formulario -->
        <form id="passForm" class="space-y-5" onsubmit="generateLink(event)">
            <div>
                <label class="block text-xs uppercase tracking-widest text-oro-viejo font-semibold mb-2">Nombre del
                    Invitado / Familia</label>
                <input type="text" id="guestNameInput" required placeholder="Ej. Familia Flores Claros"
                    class="w-full bg-azul-real border border-oro-viejo/60 rounded px-4 py-3 text-pergamino placeholder-pergamino/40 focus:outline-none focus:border-oro-viejo text-sm">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-oro-viejo font-semibold mb-2">Cantidad de
                    Pases (1 a 20)</label>
                <input type="number" id="guestPassesInput" min="1" max="20" value="2" required
                    class="w-full bg-azul-real border border-oro-viejo/60 rounded px-4 py-3 text-pergamino focus:outline-none focus:border-oro-viejo text-sm">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-oro-viejo font-semibold mb-2">URL Base
                </label>
                <input type="url" id="baseUrlInput" required readonly placeholder="https://tu-usuario.github.io/invitacion-xv/"
                    class="w-full bg-azul-real border border-oro-viejo/60 rounded px-4 py-3 text-pergamino placeholder-pergamino/40 focus:outline-none focus:border-oro-viejo text-sm">
            </div>

            <button type="submit"
                class="w-full bg-oro-viejo text-azul-real font-bold py-3 uppercase tracking-widest text-sm hover:bg-transparent hover:text-oro-viejo border border-oro-viejo transition-all duration-300 shadow-md">
                <i class="fas fa-link mr-2"></i> Generar Enlace Personalizado
            </button>
        </form>

        <!-- Contenedor Resultado -->
        <div id="resultBox" class="hidden mt-8 border-t border-oro-viejo/30 pt-6">
            <label class="block text-xs uppercase tracking-widest text-oro-viejo font-semibold mb-2">Enlace
                Generado</label>

            <div class="flex flex-col gap-3">
                <input type="text" id="generatedUrl" readonly
                    class="w-full bg-azul-real border border-oro-viejo/40 rounded px-4 py-3 text-xs text-pergamino select-all">

                <div class="flex gap-2">
                    <button type="button" onclick="copyLink()"
                        class="flex-1 bg-gris-pizarra hover:bg-gris-pizarra/80 border border-oro-viejo/60 text-pergamino font-semibold py-2.5 text-xs uppercase tracking-wider rounded transition-all flex items-center justify-center gap-2">
                        <i class="far fa-copy"></i> Copiar Enlace
                    </button>
                    <a id="whatsappBtn" href="#" target="_blank"
                        class="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white font-semibold py-2.5 text-xs uppercase tracking-wider rounded transition-all flex items-center justify-center gap-2">
                        <i class="fab fa-whatsapp"></i> Enviar por WhatsApp
                    </a>
                </div>
            </div>

            <!-- Toast de Éxito -->
            <div id="toast"
                class="hidden mt-4 bg-emerald-900/80 border border-emerald-500 text-emerald-200 text-xs px-4 py-3 rounded text-center">
                <i class="fas fa-check-circle mr-1"></i> ¡Enlace copiado al portapapeles exitosamente!
            </div>
        </div>

    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkhYqxJ3cetsy_udFaIxIbi6zJkojI7wgdhhg7TEBWeiDrBfcY3MyeRxTGTzA0Czcg7w/exec";

        // Autodetección automática al cargar la página
        window.addEventListener('DOMContentLoaded', async () => {
            if (location.protocol === 'http:' || location.protocol === 'https:') {
                const base = new URL('./', location.href);
                document.getElementById('baseUrlInput').value = base.href;
            }

            // Consultar a Google Sheets el siguiente ID
            try {
                const res = await fetch(`${SCRIPT_URL}?action=obtener_siguiente_id`);
                const data = await res.json();
                if (data.nextId) {
                    console.log("Siguiente ID sugerido:", data.nextId);
                    window.currentIdSugerido = data.nextId;
                }
            } catch (err) {
                console.error("No se pudo obtener el ID automático:", err);
                window.currentIdSugerido = "INV-001"; // Fallback por seguridad
            }
        });

        function codificarBase64Url(objeto) {
            const bytes = new TextEncoder().encode(JSON.stringify(objeto));
            let binario = '';
            bytes.forEach(byte => binario += String.fromCharCode(byte));
            return btoa(binario).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
        }

        async function generateLink(e) {
            e.preventDefault();

            const name = document.getElementById('guestNameInput').value.trim();
            const passes = Number(document.getElementById('guestPassesInput').value);
            let baseUrlStr = document.getElementById('baseUrlInput').value.trim();

            // Usar el ID que trajimos de Google Sheets (o generar uno temporal si falló)
            const assignedId = window.currentIdSugerido || "INV-001";

            let base;
            try {
                base = new URL(baseUrlStr);
                if (!['https:', 'http:'].includes(base.protocol)) throw new Error('URL no válida');
            } catch {
                alert('Escribe una dirección URL base válida.');
                return;
            }

            if (base.pathname.endsWith('/index.html') || base.pathname.endsWith('/generadorx.html')) {
                base.pathname = base.pathname.substring(0, base.pathname.lastIndexOf('/') + 1);
            } else if (!base.pathname.endsWith('/')) {
                base.pathname += '/';
            }

            // Si deseas que la URL incluya también el ID { id, n, p }
            const codigo = codificarBase64Url({ id: assignedId, n: name, p: passes });
            const urlInvitacion = new URL('index.html', base);
            urlInvitacion.searchParams.set('i', codigo);

            const finalUrl = urlInvitacion.href;
            document.getElementById('generatedUrl').value = finalUrl;

            // Configurar botón WhatsApp
            const message = encodeURIComponent(`¡Hola ${name}! Te invito cordialmente a mis XV Años. Descubre todos los detalles y tu pase exclusivo aquí: ${finalUrl}`);
            document.getElementById('whatsappBtn').href = `https://wa.me/?text=${message}`;

            document.getElementById('resultBox').classList.remove('hidden');

            // --- ENVIAR DATOS A GOOGLE SHEETS ---
            try {
                const payload = {
                    action: "registrar_invitado",
                    id: assignedId,
                    nombre: name,
                    pases: passes,
                    url: finalUrl
                };

                // Usamos mode: 'no-cors' para evitar el bloqueo de Google Apps Script en POST
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // 1. Limpiar los inputs para el siguiente invitado
                document.getElementById('guestNameInput').value = '';
                document.getElementById('guestPassesInput').value = '2'; // Valor por defecto opcional
                document.getElementById('guestNameInput').focus(); // Pone el cursor listo para escribir el nuevo nombre

                // 2. Incrementar automáticamente el ID para que el próximo sea el siguiente (ej. INV-004)
                let numActual = parseInt(assignedId.replace("INV-", "")) + 1;
                window.currentIdSugerido = "INV-" + String(numActual).padStart(3, '0');
                console.log("Siguiente ID preparado:", window.currentIdSugerido);

            } catch (err) {
                console.error("Error al registrar en Google Sheets:", err);
            }
        }

        function copyLink() {
            const urlInput = document.getElementById('generatedUrl');
            urlInput.select();
            navigator.clipboard.writeText(urlInput.value);

            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>

</html>
